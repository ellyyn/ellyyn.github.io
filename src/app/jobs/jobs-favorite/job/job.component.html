<div class="row">
    <div class="col-1 pad"><img class="images" [ngSrc]="job().companyLogo" width="100" height="100" alt="company logo"/></div>
    <div class="col-11" >
        <div class="row title pad">
            <a [routerLink]="['/jobs', job().id]">{{job().title}}</a>
        </div>
        <div class="row pad gap">
            <div>Company: {{job().companyName}}</div>
            <div>Reference: {{job().reference}}</div>
        </div>
    </div>
</div>
